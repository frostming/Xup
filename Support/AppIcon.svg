<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#1E3FBF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="680">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#DCE6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1F6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS 图标画布：1024 中留边，主体 824 的圆角方形（squircle 近似） -->
  <g transform="translate(100 100)">
    <path d="M0 184 C0 60 60 0 184 0 H640 C764 0 824 60 824 184 V640 C824 764 764 824 640 824 H184 C60 824 0 764 0 640 Z"
          fill="url(#bg)" filter="url(#shadow)"/>
    <path d="M0 184 C0 60 60 0 184 0 H640 C764 0 824 60 824 184 V640 C824 764 764 824 640 824 H184 C60 824 0 764 0 640 Z"
          fill="url(#glow)"/>
    <!-- 圆环 -->
    <circle cx="412" cy="412" r="262" fill="none" stroke="url(#ring)" stroke-width="58"/>
    <!-- 向上箭头 -->
    <g fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
      <path d="M412 560 V278"/>
      <path d="M296 392 L412 276 L528 392"/>
    </g>
    <!-- 右上小圆点：更新提示 -->
    <circle cx="668" cy="156" r="54" fill="#FF9F0A"/>
    <circle cx="668" cy="156" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="18"/>
  </g>
</svg>
